<!DOCTYPE html>
<html lang="en">
<head>
  <title>Kidney Disease Classifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
    .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
    .labels { background: #ecf0f1; padding: 15px; border-radius: 10px; margin-bottom: 30px; font-size: 14px; }
    input[type=file] { width: 100%; padding: 15px; border: 2px dashed #3498db; border-radius: 10px; background: #f8f9fa; cursor: pointer; }
    button { width: 100%; padding: 15px; font-size: 18px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    button:hover { background: #2980b9; }
    button:disabled { background: #bdc3c7; cursor: not-allowed; }
    #preview { max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 20px; display: none; }
    #result { margin-top: 30px; padding: 20px; border-radius: 10px; text-align: center; font-size: 18px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    .confidence-bar { background: #e9ecef; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
    .confidence-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); border-radius: 5px; transition: width 0.5s; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hf-link, .repo-link { text-align: center; margin-top: 30px; }
    .hf-link a, .repo-link a { color: #e74c3c; text-decoration: none; }
    .badges { text-align: center; margin-top: 20px; }
    @media (max-width: 600px) { .container { padding: 20px; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🩸 Kidney CT Classifier</h1>
    <p class="subtitle">Upload kidney CT scan. Powered by AI model on Hugging Face. Live on GitHub Pages!</p>
    
    <div class="labels">
      <strong>Classes:</strong> Cyst • Normal • Stone • Tumor
    </div>
    
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="Preview">
    
    <div class="spinner" id="spinner"></div>
    
    <button id="predictBtn">📊 Analyze Image</button>
    
    <div id="result">Select an image to get started</div>
    
    <div class="badges">
      <a href="https://github.com/A-Thiyagarajan/kidney-classifier"><img alt="GitHub" src="https://img.shields.io/badge/GitHub-Repo-black?logo=github"></a>
      <a href="https://huggingface.co/spaces/thiyagu2004/kidney-classifier"><img alt="HF Space" src="https://img.shields.io/badge/HF%20Space-Live-orange?logo=huggingface"></a>
    </div>
    
    <div class="hf-link">
      <a href="https://thiyagu2004-kidney-classifier.hf.space" target="_blank">View Model on Hugging Face</a>
    </div>
    <div class="repo-link">
      <a href="https://github.com/A-Thiyagarajan/kidney-classifier" target="_blank">Source on GitHub</a>
    </div>
  </div>

  <script>
    const HF_API = 'https://thiyagu2004-kidney-classifier.hf.space/predict';
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const predictBtn = document.getElementById('predictBtn');
    const result = document.getElementById('result');
    const spinner = document.getElementById('spinner');

    predictBtn.onclick = predict;

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        predictBtn.disabled = false;
        result.textContent = 'Ready to analyze!';
        result.className = '';
      }
    };

    async function predict() {
      const file = fileInput.files[0];
      if (!file) return alert('Please select an image');

      predictBtn.disabled = true;
      spinner.style.display = 'block';
      result.textContent = 'Analyzing your image...';
      result.className = 'loading';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(HF_API, { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Prediction failed');

        const label = data.label || `Class ${data.class_index}`;
        const conf = (data.confidence * 100).toFixed(1);
        
        result.innerHTML = `
          <strong>${label}</strong><br>
          Confidence: ${conf}%
          <div class="confidence-bar">
            <div class="confidence-fill" style="width: ${conf}%"></div>
          </div>
          <small>Raw: ${data.raw.slice(0,4).map((p,i)=>`#${i}:${(p*100).toFixed(1)}%`).join(' ')}</small>
        `;
        result.className = 'success';
      } catch (err) {
        result.innerHTML = `❌ Error: ${err.message}`;
        result.className = 'error';
      } finally {
        predictBtn.disabled = false;
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
